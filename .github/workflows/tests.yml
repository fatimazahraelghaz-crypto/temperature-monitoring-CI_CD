name: CI/CD Temperature Monitoring

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run pytest (Testing Automatique)
      run: pytest -v

    - name: Afficher l'etat de temperature (Simulation)
      run: |
        python -c "from temperature import check_temperature; [print(f'Temperature = {t}°C  --->  Statut : {check_temperature(t)}') for t in [20, 29, 30, 40]]"

    - name: Package deliverable (CD)
      run: |
        mkdir -p release
        cp temperature.py README.md release/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: temperature-monitor-release
        path: release/