name: CI/CD Temperature Monitoring

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run pytest
        run: pytest -v

      - name: Package deliverable
        run: |
          mkdir dist
          cp temperature.py dist/
          cp README.md dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: temperature-monitor-release
          path: dist/